# Place at .github/workflows/tracker.yml
# Every 30 minutes: checks every company in companies.yaml and sends Telegram alerts for
# NEW intern / new-grad / early-career roles in tech, data, software and AI/ML fields (ML_ONLY "1").
name: ml-job-tracker
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - run: python tracker.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALL_ROLES: "1"   # "1" = every non-senior role at every company; "0" = only intern/grad/entry-level titles
          ML_ONLY: "1"   # "1" = tech, data, AI/ML and software titles only; "0" = all fields
      - run: |
          git config user.name "tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json open_roles.md
          git diff --cached --quiet || (git commit -m "update seen" && git push)
