# Place at .github/workflows/tracker.yml
# Every 30 minutes: checks every company in companies.yaml and sends Telegram alerts for
# NEW intern / new-grad / early-career roles in ALL fields (ML_ONLY "0").
name: ml-job-tracker
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - run: python tracker.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ML_ONLY: "0"   # "0" = all roles; set "1" to keep only tech/AI/ML/software titles
      - run: |
          git config user.name "tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json open_roles.md
          git diff --cached --quiet || (git commit -m "update seen" && git push)
