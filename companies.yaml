# Hand-picked companies. build-list adds Greenhouse, Lever, Ashby and Workday boards automatically.
# all_roles: true = alert on every AI/ML role, not just intern/grad titles.
companies:
  - {name: OpenAI,     platform: ashby,  slug: openai,       all_roles: true}
  - {name: Cohere,     platform: ashby,  slug: cohere}
  - {name: Perplexity, platform: ashby,  slug: perplexityai}
  - {name: Ramp,       platform: ashby,  slug: ramp}
  - {name: Notion,     platform: ashby,  slug: notion}
  - {name: Mistral,    platform: lever,  slug: mistral}
  - {name: Palantir,   platform: lever,  slug: palantir}
  - {name: NVIDIA, platform: workday, host: nvidia.wd5.myworkdayjobs.com, tenant: nvidia, site: NVIDIAExternalCareerSite}
  - {name: Amazon, platform: amazon, search: [intern, university graduate, machine learning, applied scientist]}
